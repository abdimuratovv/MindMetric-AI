databases:
  - name: mindmetric-db
    plan: free
    databaseName: mindmetric
    user: mindmetric

services:
  - type: web
    name: mindmetric-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_assessment_content"
    startCommand: "gunicorn mindmetric.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: mindmetric-backend-48ad.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://mindmetric-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: mindmetric-db
          property: connectionString

  - type: web
    name: mindmetric-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      # Proxied server-side by Render's edge, so the browser never sees a
      # different origin and no CORS preflight is triggered for /api calls.
      - type: rewrite
        source: /api/*
        destination: https://mindmetric-backend-48ad.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
